
name: Test Floorball Connector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test iBIS startkit
        run: |
          python - <<'PY'
          import requests

          url = "https://api.innebandy.se/StatsAppApi/api/startkit"

          response = requests.get(
              url,
              headers={
                  "Accept": "application/json",
                  "Origin": "https://stats.innebandy.se",
              },
              timeout=30,
          )

          print("HTTP status:", response.status_code)
          response.raise_for_status()

          data = response.json()

          assert data.get("accessToken"), "Missing access token"
          assert data.get("apiRoot"), "Missing API root"
          assert data.get("accessTokenExpiration"), "Missing expiration"

          print("Access token received:", True)
          print("API root:", data["apiRoot"])
          print("Token expiration received:", True)
          print("iBIS startkit test PASSED")
          PY
