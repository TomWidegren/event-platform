
name: Test Floorball Connector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test iBIS authenticated API
        run: |
          python - <<'PY'
          import requests

          session = requests.Session()

          startkit = session.get(
              "https://api.innebandy.se/StatsAppApi/api/startkit",
              headers={
                  "Accept": "application/json",
                  "Origin": "https://stats.innebandy.se",
              },
              timeout=30,
          )
          startkit.raise_for_status()

          credentials = startkit.json()
          token = credentials["accessToken"]
          api_root = credentials["apiRoot"].rstrip("/")

          assert token, "Missing access token"

          print("Startkit authentication: OK")

          match_id = 1750693

          response = session.get(
              f"{api_root}/matches/{match_id}",
              headers={
                  "Accept": "application/json",
                  "Authorization": f"Bearer {token}",
                  "Origin": "https://stats.innebandy.se",
              },
              timeout=30,
          )

          print("Match API HTTP status:", response.status_code)
          response.raise_for_status()

          data = response.json()

          assert data["MatchID"] == match_id

          print("Match:", data["MatchID"])
          print("Home:", data["HomeTeam"])
          print("Away:", data["AwayTeam"])
          print("Start:", data["MatchDateTime"])
          print("Final:", data["HasFinalResult"])
          print("Events:", len(data.get("Events") or []))
          print("iBIS authenticated API test PASSED")
          PY
