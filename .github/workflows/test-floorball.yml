
name: Test Floorball Connector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test iBIS connector
        run: |
          python - <<'PY'
          from connectors.ibis_floorball import fetch_snapshot

          watch = {
              "id": "floorball-match-1750693",
              "name": "Huddinge IBS - Tyresö Trollbäcken IBK",
              "connector": "ibis_floorball",
              "mode": "live",
              "source": {
                  "match_id": 1750693,
                  "team_id": 20872,
                  "highlight_player_id": 585280,
              },
          }

          snapshot = fetch_snapshot(watch)

          assert snapshot is not None, "No snapshot returned"
          assert snapshot["match_id"] == 1750693, "Wrong match ID"
          assert snapshot["home_team"] == "Huddinge IBS"
          assert snapshot["away_team"] == "Tyresö Trollbäcken IBK"

          print("Match:", snapshot["match_id"])
          print("Home:", snapshot["home_team"])
          print("Away:", snapshot["away_team"])
          print("Start:", snapshot["match_datetime"])
          print("Status:", snapshot["match_status"])
          print("Final:", snapshot["has_final_result"])
          print("Events:", len(snapshot["events"]))
          print("Floorball connector test PASSED")
          PY

      - name: Test floorball notification formatting
        run: python -m unittest discover -s tests -p "test_floorball_formatting.py" -v


      - name: Test floorball baseline
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from unittest.mock import patch

          import watcher

          watch = {
              "id": "floorball-match-1750693",
              "name": "Huddinge IBS - Tyresö Trollbäcken IBK",
              "connector": "ibis_floorball",
              "mode": "live",
              "source": {
                  "match_id": 1750693,
                  "team_id": 20872,
                  "highlight_player_id": 585280,
              },
          }

          with tempfile.TemporaryDirectory() as tmp:
              test_state = Path(tmp) / "state.json"

              config = {
                  "watches": [watch],
                  "ntfy": {"topic": "test-only"},
              }

              with (
                  patch.object(watcher, "load_config", return_value=config),
                  patch.object(watcher, "STATE_FILE", test_state),
                  patch.object(watcher, "send_ntfy") as mock_ntfy,
                  patch.dict("os.environ", {"RUN_MODE": "live"}),
              ):
                  watcher.main()

              assert test_state.exists(), "Baseline was not saved"

              state = json.loads(test_state.read_text(encoding="utf-8"))

              assert watch["id"] in state, "Watch ID missing in state"
              assert state[watch["id"]]["fields"]["match_id"] == 1750693
              assert not mock_ntfy.called, "Unexpected notification"

              print("Baseline saved:", True)
              print("Notification sent:", False)
              print("Existing repository state untouched:", True)
              print("Floorball baseline test PASSED")
          PY

