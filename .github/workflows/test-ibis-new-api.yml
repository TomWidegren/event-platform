name: Test iBIS New API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Verify signed iBIS v2 retrieval
        run: |
          python - <<'PY'
          import hashlib
          import hmac
          import time
          import uuid

          import requests

          BASE = "https://api.innebandy.se/v2/api"
          ORIGIN = "https://stats.innebandy.se"
          MATCH_ID = 1750719
          COMPETITION_ID = 45004

          HEADERS = {
              "Accept": "application/json",
              "Origin": ORIGIN,
              "Referer": (
                  f"{ORIGIN}/sasong/44/serie/"
                  f"{COMPETITION_ID}/match/{MATCH_ID}"
              ),
          }


          def require_success(response, operation):
              print(
                  f"{operation}: HTTP {response.status_code}",
                  flush=True,
              )
              if response.status_code != 200:
                  raise RuntimeError(
                      f"{operation} failed: "
                      f"HTTP {response.status_code}"
                  )


          def signed_get(
              session,
              path,
              secret,
              server_time,
              handshake_received,
              operation,
          ):
              timestamp = str(
                  int(
                      server_time
                      + (
                          time.monotonic()
                          - handshake_received
                      ) * 1000
                  )
              )
              nonce = str(uuid.uuid4())
              body_hash = hashlib.sha256(b"").hexdigest()

              canonical_request = "\n".join(
                  (
                      "GET",
                      path,
                      timestamp,
                      nonce,
                      body_hash,
                  )
              )

              signature = hmac.new(
                  secret.encode("utf-8"),
                  canonical_request.encode("utf-8"),
                  hashlib.sha256,
              ).hexdigest()

              response = session.get(
                  f"https://api.innebandy.se{path}",
                  headers={
                      "X-Signature": signature,
                      "X-Timestamp": timestamp,
                      "X-Nonce": nonce,
                  },
                  timeout=30,
                  allow_redirects=False,
              )
              require_success(response, operation)
              return response.json()


          with requests.Session() as session:
              session.headers.update(HEADERS)

              response = session.get(
                  f"{BASE}/auth/startkit",
                  timeout=30,
                  allow_redirects=False,
              )
              require_success(response, "Startkit")

              credentials = response.json()
              token = credentials.get("accessToken")
              api_root = credentials.get("apiRoot")

              if not isinstance(token, str) or not token:
                  raise ValueError("Missing access token")

              if (
                  not isinstance(api_root, str)
                  or api_root.rstrip("/") != f"{BASE}/public"
              ):
                  raise ValueError("Unexpected API root")

              session.headers["Authorization"] = (
                  f"Bearer {token}"
              )

              response = session.post(
                  f"{BASE}/auth/handshake",
                  timeout=30,
                  allow_redirects=False,
              )
              require_success(response, "Handshake")

              handshake_received = time.monotonic()
              handshake = response.json()
              secret = handshake.get("ss")
              server_time = handshake.get("st")

              if not isinstance(secret, str) or not secret:
                  raise ValueError("Missing session secret")

              if type(server_time) not in (int, float):
                  raise ValueError(
                      "Unexpected server timestamp format"
                  )

              print(
                  "Session cookie established:",
                  bool(session.cookies),
                  flush=True,
              )

              data = signed_get(
                  session,
                  f"/v2/api/public/matches/{MATCH_ID}",
                  secret,
                  server_time,
                  handshake_received,
                  "Signed match request",
              )

              if not isinstance(data, dict):
                  raise ValueError(
                      "Unexpected match response format"
                  )

              if data.get("MatchID") != MATCH_ID:
                  raise ValueError("Unexpected MatchID")

              print("MATCH RETRIEVAL: PASS", flush=True)
              print(
                  "MatchID verified:",
                  MATCH_ID,
                  flush=True,
              )

              matches = signed_get(
                  session,
                  (
                      "/v2/api/public/competitions/"
                      f"{COMPETITION_ID}/matches"
                  ),
                  secret,
                  server_time,
                  handshake_received,
                  "Competition matches",
              )

              if not isinstance(matches, list):
                  raise ValueError("Expected a match list")

              if not any(
                  isinstance(match, dict)
                  and match.get("MatchID") == MATCH_ID
                  and match.get("CompetitionID") == COMPETITION_ID
                  for match in matches
              ):
                  raise ValueError(
                      "Expected match missing from competition"
                  )

              print("COMPETITION RETRIEVAL: PASS", flush=True)
              print(
                  "Matches returned:",
                  len(matches),
                  flush=True,
              )
          PY
