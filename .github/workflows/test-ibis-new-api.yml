
name: Test iBIS New API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Diagnose iBIS v2 session
        run: |
          python - <<'PY'
          import requests

          BASE = "https://api.innebandy.se/v2/api"
          ORIGIN = "https://stats.innebandy.se"

          HEADERS = {
              "Accept": "application/json",
              "Origin": ORIGIN,
          }

          with requests.Session() as session:
              print("STEP 1: Startkit", flush=True)

              response = session.get(
                  f"{BASE}/auth/startkit",
                  headers=HEADERS,
                  timeout=30,
              )

              print(
                  "Startkit HTTP status:",
                  response.status_code,
                  flush=True,
              )
              response.raise_for_status()

              credentials = response.json()

              if not isinstance(credentials, dict):
                  raise ValueError(
                      "Unexpected startkit response"
                  )

              token = credentials.get("accessToken")
              api_root = credentials.get("apiRoot")

              if not isinstance(token, str) or not token:
                  raise ValueError("Missing accessToken")

              if api_root != f"{BASE}/public/":
                  raise ValueError("Unexpected apiRoot")

              print("STARTKIT: PASS", flush=True)

              print(
                  "Cookies after startkit:",
                  len(session.cookies),
                  flush=True,
              )

              print("STEP 2: Handshake", flush=True)

              response = session.post(
                  f"{BASE}/auth/handshake",
                  headers={
                      **HEADERS,
                      "Authorization": f"Bearer {token}",
                  },
                  timeout=30,
              )

              print(
                  "Handshake HTTP status:",
                  response.status_code,
                  flush=True,
              )

              print(
                  "Set-Cookie present:",
                  "Set-Cookie" in response.headers,
                  flush=True,
              )

              print(
                  "Session cookie count:",
                  len(session.cookies),
                  flush=True,
              )

              if response.status_code != 200:
                  print(
                      "HANDSHAKE: NOT ACCEPTED",
                      flush=True,
                  )
                  raise SystemExit(0)

              print("HANDSHAKE: PASS", flush=True)

              try:
                  data = response.json()
              except ValueError:
                  print(
                      "Handshake response is not JSON",
                      flush=True,
                  )
              else:
                  if isinstance(data, dict):
                      print(
                          "Handshake JSON field names:",
                          sorted(data.keys()),
                          flush=True,
                      )
                  else:
                      print(
                          "Handshake JSON is not an object",
                          flush=True,
                      )

              print(
                  "DIAGNOSTIC TEST COMPLETED",
                  flush=True,
              )
          PY
