
name: Test iBIS New API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Test iBIS v2 handshake
        run: |
          python - <<'PY'
          import requests

          BASE = "https://api.innebandy.se/v2/api"
          ORIGIN = "https://stats.innebandy.se"
          MATCH_ID = 1750719

          with requests.Session() as session:
              print("STEP 1: Startkit", flush=True)

              response = session.get(
                  f"{BASE}/auth/startkit",
                  headers={
                      "Accept": "application/json",
                      "Origin": ORIGIN,
                  },
                  timeout=30,
              )
              print("Startkit status:", response.status_code, flush=True)
              response.raise_for_status()

              credentials = response.json()
              token = credentials["accessToken"]
              api_root = credentials["apiRoot"].rstrip("/")

              if api_root != f"{BASE}/public":
                  raise ValueError("Unexpected API root")

              print("STARTKIT: PASS", flush=True)

              print("STEP 2: Handshake", flush=True)

              response = session.post(
                  f"{BASE}/auth/handshake",
                  headers={
                      "Accept": "application/json",
                      "Authorization": f"Bearer {token}",
                      "Origin": ORIGIN,
                  },
                  timeout=30,
              )

              print("Handshake status:", response.status_code, flush=True)

              if response.status_code != 200:
                  print("HANDSHAKE: NOT ACCEPTED", flush=True)
                  print("DIAGNOSTIC TEST COMPLETED", flush=True)
                  raise SystemExit(0)

              print("HANDSHAKE: PASS", flush=True)

              print("STEP 3: Match retrieval", flush=True)

              response = session.get(
                  f"{api_root}/matches/{MATCH_ID}",
                  headers={
                      "Accept": "application/json",
                      "Authorization": f"Bearer {token}",
                      "Origin": ORIGIN,
                  },
                  timeout=30,
              )

              print("Match status:", response.status_code, flush=True)

              if response.status_code == 200:
                  data = response.json()

                  if data.get("MatchID") != MATCH_ID:
                      raise ValueError("Unexpected MatchID")

                  print("MATCH RETRIEVAL: PASS", flush=True)
                  print(
                      "Event count:",
                      len(data.get("Events") or []),
                      flush=True,
                  )
              else:
                  print("MATCH RETRIEVAL: NOT ACCEPTED", flush=True)

              print("DIAGNOSTIC TEST COMPLETED", flush=True)
          PY
