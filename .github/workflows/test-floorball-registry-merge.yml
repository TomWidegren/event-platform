
name: Test Floorball Registry Merge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run registry merge tests
        run: python -m unittest discover -s tests -p "test_floorball_registry_merge.py" -v
